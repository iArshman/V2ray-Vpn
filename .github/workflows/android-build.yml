name: Android Release APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-release-apks:
    name: Build signed minified release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          fi

      - name: Prepare keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android123' }}
        run: |
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 --decode > debug.keystore
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > my-upload-key.jks
          else
            keytool -genkeypair -noprompt -v \
              -keystore my-upload-key.jks \
              -storepass "$STORE_PASSWORD" \
              -alias upload \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Hollow VPN Release,O=Hollow VPN,C=US"
          fi

      - name: Cache libv2ray.aar (AndroidLibXrayLite v26.10.31)
        id: cache-libv2ray
        uses: actions/cache@v4
        with:
          path: app/libs/libv2ray.aar
          key: libv2ray-aar-v26.10.31

      - name: Download libv2ray.aar if missing
        if: steps.cache-libv2ray.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/libs
          curl -fSL --retry 3 -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.31/libv2ray.aar"

      - name: Ensure .env file exists
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Cache Robolectric android-all runtime
        id: cache-robolectric
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-android-all-16-robolectric-13921718-i7

      - name: Pre-download Robolectric SDK 36 runtime if missing
        if: steps.cache-robolectric.outputs.cache-hit != 'true'
        run: |
          ROBO_VER="16-robolectric-13921718-i7"
          ROBO_DIR="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$ROBO_VER"
          BASE_URL="https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/$ROBO_VER"
          mkdir -p "$ROBO_DIR"
          for ext in pom pom.sha512 jar jar.sha512; do
            FILE="android-all-instrumented-${ROBO_VER}.${ext}"
            curl -fSL --retry 5 --retry-all-errors --connect-timeout 20 -o "$ROBO_DIR/$FILE" "$BASE_URL/$FILE"
          done

      - name: Run unit and Robolectric tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build v7a, arm64-v8a, and universal release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android123' }}
        run: gradle assembleRelease --stacktrace

      - name: Upload armeabi-v7a release APK
        uses: actions/upload-artifact@v4
        with:
          name: hollow-vpn-armeabi-v7a-release
          path: app/build/outputs/apk/release/*armeabi-v7a*.apk
          if-no-files-found: error

      - name: Upload arm64-v8a release APK
        uses: actions/upload-artifact@v4
        with:
          name: hollow-vpn-arm64-v8a-release
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Upload universal release APK
        uses: actions/upload-artifact@v4
        with:
          name: hollow-vpn-universal-release
          path: app/build/outputs/apk/release/*universal*.apk
          if-no-files-found: error
